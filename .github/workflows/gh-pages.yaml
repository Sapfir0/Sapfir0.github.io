name: Build and Deploy
on: [push]
permissions:
  contents: write
jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          # Fetch real GPX files; without this, the runner keeps LFS pointers
          # and the deployed site serves pointer text instead of GPX content.
          lfs: true

      - name: Install dependencies 🔧
        run: yarn

      - name: Lint 🧹
        run: yarn lint

      - name: Check formatting 📐
        run: yarn format:check

      - name: Run tests ✅
        run: yarn test

      - name: Build 📦
        run: yarn build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
